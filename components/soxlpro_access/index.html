<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent;
      font-family: Inter, system-ui, sans-serif; }
    #bar { display: flex; justify-content: flex-end; align-items: center;
      gap: 7px; min-height: 42px; }
    button { border: 1px solid #cbd5e1; border-radius: 8px; padding: 9px 11px;
      background: white; color: #0f172a; font-weight: 650; cursor: pointer;
      white-space: nowrap; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    #pay { background: #0f172a; color: white; border-color: #0f172a; }
    #status { color: #64748b; font-size: 11px; white-space: nowrap; }
  </style>
</head>
<body>
  <div id="bar">
    <span id="status"></span>
    <button id="login">Sign in with Google</button>
    <button id="logout" hidden>Sign out</button>
    <button id="pay">Subscribe</button>
  </div>
  <script>
    const parentWindow = window.parent;
    let args = {};
    let lastPayload = "";
    function send(type, data) {
      parentWindow.postMessage({isStreamlitMessage: true, type, ...data}, "*");
    }
    function setValue(payload) {
      const encoded = JSON.stringify(payload);
      if (encoded === lastPayload) return;
      lastPayload = encoded;
      send("streamlit:setComponentValue", {value: payload, dataType: "json"});
    }
    function track(name, data = {}) {
      try {
        const tracker = parentWindow.umami || window.umami;
        if (tracker && typeof tracker.track === "function") tracker.track(name, data);
      } catch (_) {}
    }
    function report(action) {
      setValue({action, action_id: crypto.randomUUID()});
    }
    function go(path) {
      parentWindow.location.href = new URL(path, parentWindow.location.origin);
    }
    function updateBar() {
      document.getElementById("login").hidden = args.authenticated;
      document.getElementById("logout").hidden = !args.authenticated;
      const pay = document.getElementById("pay");
      pay.textContent = args.paid ? "Manage membership" : "Subscribe";
      pay.disabled = !args.stripe_configured;
      document.getElementById("status").textContent = args.paid
        ? "Member"
        : args.remaining_actions +
          (args.authenticated ? " free actions" : " preview actions");
    }
    document.getElementById("login").onclick = () => {
      track("google_login_requested", {source: "header"});
      go(args.login_url);
    };
    document.getElementById("logout").onclick = () => go(args.logout_url);
    document.getElementById("pay").onclick = () => {
      track("subscription_clicked", {signed_in: args.authenticated});
      if (!args.authenticated) {
        go(args.login_url + "?subscribe=1");
      } else {
        report(args.paid ? "portal" : "checkout");
      }
    };
    window.addEventListener("message", (event) => {
      if (event.data?.type !== "streamlit:render") return;
      args = event.data.args || {};
      send("streamlit:setFrameHeight", {height: 46});
      updateBar();
    });
    send("streamlit:componentReady", {apiVersion: 1});
  </script>
</body>
</html>
