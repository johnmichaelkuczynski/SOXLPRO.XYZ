<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Interactive SOXL historical price chart</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: transparent; overflow-x: hidden; }
  #toolbar { display: flex; gap: 8px; align-items: center; padding: 6px 2px; flex-wrap: wrap; }
  .tbtn {
    padding: 7px 18px; border: 1px solid #ccc; border-radius: 6px; cursor: pointer;
    font-size: 14px; background: #fff; color: #333; transition: all 0.15s;
    user-select: none;
  }
  .tbtn:hover { background: #f0f0f0; }
  .tbtn.active { background: #4A90D9; color: #fff; border-color: #4A90D9; }
  .tbtn:disabled { opacity: 0.45; cursor: not-allowed; background: #f5f5f5; }
   .tbtn.danger { color: #B71C1C; border-color: #B71C1C; }
   .tbtn.danger:hover { background: #B71C1C; color: #fff; }
   .tbtn.danger.active { background: #B71C1C; color: #fff; border-color: #B71C1C; }
  #status { font-size: 13px; color: #555; margin-left: 8px; }
  .scale-group {
    display: inline-flex; align-items: center; gap: 0; border: 1px solid #bbb;
    border-radius: 6px; overflow: hidden; background: #fff;
  }
  .scale-group .tbtn { border: 0; border-radius: 0; padding: 7px 12px; }
  .scale-group .tbtn + .tbtn { border-left: 1px solid #ccc; }
  .height-control {
    display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px;
    border: 1px solid #ccc; border-radius: 6px; background: #fff;
    font-size: 13px; color: #334155;
  }
  .height-control input { width: 150px; cursor: ns-resize; }
  #heightValue { min-width: 48px; font-weight: 700; color: #0f172a; }
   .sr-only {
     position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
     overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
   }
  #chart-scroll { width: 100%; overflow-x: auto; overflow-y: hidden; }
  #chart-container { position: relative; width: 100%; min-width: 100%; }
  #chart { width: 100%; }
  #select-overlay {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    cursor: crosshair;
    z-index: 100;
  }
  #select-highlight {
    position: absolute;
    top: 0;
    height: 100%;
    background: rgba(74, 144, 217, 0.25);
    border-left: 3px solid #1565C0;
    border-right: 3px solid #1565C0;
    display: none;
    pointer-events: none;
  }
  #trend-tooltip {
    display: none; position: absolute; z-index: 120; pointer-events: none;
    min-width: 235px; padding: 10px 12px; border-radius: 8px;
    color: #f8fafc; background: rgba(15, 23, 42, 0.96);
    box-shadow: 0 5px 18px rgba(15, 23, 42, 0.28);
    font-size: 13px; line-height: 1.45;
  }
  #trend-tooltip strong { display: block; color: #fff; margin-bottom: 3px; }
  #analyze-bar {
    display: none;
    padding: 10px 12px; margin: 6px 2px;
    background: #E3F2FD; border: 2px solid #1565C0; border-radius: 8px;
    align-items: center; gap: 12px; flex-wrap: wrap;
  }
  #analyze-bar span { font-size: 14px; color: #1565C0; font-weight: 600; }
  .analyze-btn {
    padding: 8px 24px; border: none; border-radius: 6px; cursor: pointer;
    font-size: 14px; font-weight: 700; color: #fff; background: #43A047;
  }
  .analyze-btn:hover { background: #388E3C; }
  .analyze-clear {
    padding: 6px 12px; border: 1px solid #90CAF9; border-radius: 6px; cursor: pointer;
    font-size: 13px; background: #fff; color: #1565C0;
  }
  .analyze-clear:hover { background: #BBDEFB; }
  #line-list { padding: 4px 2px; }
  .line-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 13px; color: #555; }
  .line-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .ldel { cursor: pointer; color: #fff; border: 1px solid #B71C1C; border-radius: 5px; background: #B71C1C; font-size: 12px; font-weight: 700; padding: 5px 10px; }
   .ldel:hover { background: #8E0000; }
   .lext { cursor: pointer; color: #fff; border: 1px solid #1565C0; border-radius: 5px; background: #1565C0; font-size: 12px; font-weight: 700; padding: 5px 10px; }
   .lext:hover, .lext.active { background: #0D47A1; }
   #keyboard-selection {
     display: none; align-items: end; gap: 10px; flex-wrap: wrap;
     padding: 8px 12px; margin: 6px 2px; background: #f8f9fa;
     border: 1px solid #d9e2ec; border-radius: 8px;
   }
   #keyboard-selection-heading { font-size: 13px; font-weight: 600; color: #334e68; width: 100%; }
   #keyboard-selection label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: #486581; }
   #keyboard-selection input { padding: 6px 8px; border: 1px solid #9fb3c8; border-radius: 5px; font-size: 13px; color: #102a43; }
   .range-apply {
     padding: 7px 14px; border: 1px solid #1565C0; border-radius: 6px;
     cursor: pointer; font-size: 13px; font-weight: 600; color: #fff; background: #1565C0;
   }
   .range-apply:hover { background: #0D47A1; }
</style>
</head>
<body>
<div id="toolbar">
  <button class="tbtn" id="drawBtn" aria-pressed="false" onclick="toggleDraw()">&#9998; Draw Line</button>
  <button class="tbtn danger" id="eraseBtn" aria-pressed="false" onclick="toggleErase()" disabled>&#9003; Erase Line</button>
  <button class="tbtn" id="undoBtn" onclick="undoLastAction()" disabled>&#8630; Undo</button>
  <button class="tbtn" id="selectBtn" aria-pressed="false" onclick="toggleSelect()">&#9634; Select Period</button>
  <button class="tbtn" onclick="resetView()">&#8634; Reset View</button>
  <span class="scale-group" role="group" aria-label="Price scale">
    <button class="tbtn active" id="logScaleBtn" aria-pressed="true" onclick="setScale('log')">Log Scale</button>
    <button class="tbtn" id="linearScaleBtn" aria-pressed="false" onclick="setScale('linear')">Linear Scale</button>
  </span>
  <label class="height-control" for="heightSlider">
    Chart height
    <input id="heightSlider" type="range" min="520" max="1400" step="40" value="900" oninput="setChartHeight(this.value)">
    <span id="heightValue">900 px</span>
  </label>
  <label class="height-control" for="widthSlider">
    Chart width
    <input id="widthSlider" type="range" min="100" max="300" step="10" value="100" oninput="setChartWidth(this.value)">
    <span id="widthValue">100%</span>
  </label>
  <button class="tbtn danger" id="clearBtn" onclick="clearAll()" style="display:none">&#128465; Delete All Lines</button>
  <span id="status">Drag to scroll &#8226; Wheel to zoom &#8226; Hover trend lines for projected date and price</span>
  <span id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span>
</div>
<div id="chart-scroll">
  <div id="chart-container">
    <div id="chart"></div>
    <div id="select-overlay" aria-hidden="true"></div>
    <div id="select-highlight"></div>
    <div id="trend-tooltip" role="tooltip"></div>
  </div>
</div>
<div id="keyboard-selection" aria-labelledby="keyboard-selection-heading">
  <span id="keyboard-selection-heading">Keyboard period selection</span>
  <label for="start-date">Start date
    <input id="start-date" type="date">
  </label>
  <label for="end-date">End date
    <input id="end-date" type="date">
  </label>
  <button class="range-apply" onclick="applyKeyboardSelection()">Apply date range</button>
</div>
<div id="analyze-bar">
  <span id="analyze-text"></span>
  <button class="analyze-btn" onclick="analyzeSelection()">Analyze This Period</button>
  <button class="analyze-clear" onclick="clearSelection()">&#10005; Clear</button>
</div>
<div id="line-list"></div>

<script>
var COLORS = ['#888','#E53935','#43A047','#FB8C00','#8E24AA','#00ACC1','#6D4C41','#D81B60','#00897B','#FFB300'];
var chartDiv = document.getElementById('chart');
var chartContainer = document.getElementById('chart-container');
var chartScroll = document.getElementById('chart-scroll');
var selectOverlay = document.getElementById('select-overlay');
var selectHighlight = document.getElementById('select-highlight');
var trendTooltip = document.getElementById('trend-tooltip');
var currentMode = 'pan';
var lines = [];
var chartData = null;
var rendered = false;
var knownShapeCount = 0;
var scaleMode = 'log';
var currentChartHeight = 900;
var currentChartWidth = 100;
var plotlyEventsBound = false;
var undoStack = [];
var hoveredLineIndex = -1;
var hoveredLineDistance = Infinity;
var extendingLineIndex = -1;

var selecting = false;
var selectStartX = 0;
var selectedRange = null;

function sendToStreamlit(type, data) {
  window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, data), "*");
}
function setComponentValue(value) {
  sendToStreamlit("streamlit:setComponentValue", {value: value});
}
function setFrameHeight(h) {
  sendToStreamlit("streamlit:setFrameHeight", {height: h});
}

function announce(message) {
  document.getElementById('announcement').textContent = message;
}

function configureKeyboardDateInputs() {
  if (!chartData || !chartData.dates || chartData.dates.length === 0) return;
  var startInput = document.getElementById('start-date');
  var endInput = document.getElementById('end-date');
  var minDate = msToDateStr(new Date(chartData.dates[0]).getTime());
  var maxDate = msToDateStr(new Date(chartData.dates[chartData.dates.length - 1]).getTime());
  startInput.min = minDate;
  startInput.max = maxDate;
  endInput.min = minDate;
  endInput.max = maxDate;
  if (!startInput.value) startInput.value = minDate;
  if (!endInput.value) endInput.value = maxDate;
}

window.addEventListener("message", function(event) {
  if (event.data.type === "streamlit:render") {
    var args = event.data.args;
    chartData = {
      dates: args.dates,
      prices: args.prices,
      qqq_dates: args.qqq_dates || [],
      qqq_prices: args.qqq_prices || [],
      qqq_actual: args.qqq_actual || [],
      tqqq_dates: args.tqqq_dates || [],
      tqqq_prices: args.tqqq_prices || [],
      tqqq_actual: args.tqqq_actual || [],
      tlt_dates: args.tlt_dates || [],
      tlt_prices: args.tlt_prices || [],
      tlt_actual: args.tlt_actual || [],
      xlu_dates: args.xlu_dates || [],
      xlu_prices: args.xlu_prices || [],
      xlu_actual: args.xlu_actual || [],
      vix_dates: args.vix_dates || [],
      vix_prices: args.vix_prices || [],
      vix_actual: args.vix_actual || [],
      sox_dates: args.sox_dates || [],
      sox_prices: args.sox_prices || [],
      sox_actual: args.sox_actual || [],
      gush_dates: args.gush_dates || [],
      gush_prices: args.gush_prices || [],
      gush_actual: args.gush_actual || [],
      btc_dates: args.btc_dates || [],
      btc_prices: args.btc_prices || [],
      btc_actual: args.btc_actual || [],
      custom_label: args.custom_label || '',
      custom_dates: args.custom_dates || [],
      custom_prices: args.custom_prices || [],
      custom_actual: args.custom_actual || [],
      future_end: args.future_end,
      chart_height: args.chart_height || 900
    };
    if (!rendered) {
      currentChartHeight = chartData.chart_height;
      document.getElementById('heightSlider').value = currentChartHeight;
      document.getElementById('heightValue').textContent = currentChartHeight + ' px';
    }
     configureKeyboardDateInputs();
    if (!rendered) {
      lines = (args.lines || []).slice();
      rendered = true;
    }
    renderChart();
    renderLineList();
    setTimeout(function() { setFrameHeight(document.body.scrollHeight + 20); }, 300);
  }
});

sendToStreamlit("streamlit:componentReady", {apiVersion: 1});

function setMode(mode) {
  currentMode = mode;
  var drawBtn = document.getElementById('drawBtn');
  var eraseBtn = document.getElementById('eraseBtn');
  var selectBtn = document.getElementById('selectBtn');
  drawBtn.classList.toggle('active', mode === 'draw');
  eraseBtn.classList.toggle('active', mode === 'erase');
  selectBtn.classList.toggle('active', mode === 'select');
  drawBtn.setAttribute('aria-pressed', mode === 'draw' ? 'true' : 'false');
  eraseBtn.setAttribute('aria-pressed', mode === 'erase' ? 'true' : 'false');
  selectBtn.setAttribute('aria-pressed', mode === 'select' ? 'true' : 'false');
  drawBtn.textContent = mode === 'draw' ? '[ ] Stop Drawing' : '\u270E Draw Line';
  eraseBtn.textContent = mode === 'erase' ? '[ ] Stop Erasing' : '\u232B Erase Line';
  selectBtn.textContent = mode === 'select' ? '[ ] Stop Selecting' : '\u25A2 Select Period';

  selectOverlay.style.display = mode === 'select' ? 'block' : 'none';
  document.getElementById('keyboard-selection').style.display = mode === 'select' ? 'flex' : 'none';

  if (mode !== 'select' && selectedRange) {
    clearSelection();
  }

  var statusText = 'Drag to scroll \u2022 Wheel to zoom \u2022 Hover trend lines for projected date and price \u2022 Double-click a line to delete it';
  if (mode === 'draw') statusText = 'Click and drag on the chart to draw a line \u2022 Double-click a line to delete it';
  if (mode === 'erase') statusText = 'Click any trend line once to erase it \u2022 Use Undo to restore it';
  if (mode === 'extend') statusText = 'Click farther left or right on the chart to extend the selected line along its existing slope';
  if (mode === 'select') statusText = 'Drag across the chart to select a time period for analysis';
  document.getElementById('status').textContent = statusText;
  var modeAnnouncement = mode === 'draw'
    ? 'Draw Line mode enabled.'
    : mode === 'erase'
      ? 'Erase Line mode enabled.'
    : mode === 'extend'
      ? 'Extend Line mode enabled.'
    : mode === 'select'
      ? 'Select Period mode enabled.'
      : 'Chart navigation mode enabled.';
  announce(modeAnnouncement + ' ' + statusText);
  setTimeout(function() { setFrameHeight(document.body.scrollHeight + 20); }, 50);

  Plotly.relayout(chartDiv, {
    dragmode: mode === 'draw' ? 'drawline' : 'pan',
    'newshape.line.color': '#888',
    'newshape.line.width': 2
  });
}

function toggleDraw() { setMode(currentMode === 'draw' ? 'pan' : 'draw'); }
function toggleErase() { setMode(currentMode === 'erase' ? 'pan' : 'erase'); }
function toggleSelect() { setMode(currentMode === 'select' ? 'pan' : 'select'); }

function startExtendLine(index) {
  if (index < 0 || index >= lines.length) return;
  extendingLineIndex = index;
  setMode('extend');
  renderLineList();
  announce('Line ' + (index + 1) + ' selected. Click farther left or right on the chart to extend it.');
}

function allVisiblePrices() {
  if (!chartData) return [];
  var series = [
    chartData.prices, chartData.qqq_prices, chartData.tqqq_prices,
    chartData.tlt_prices, chartData.xlu_prices, chartData.vix_prices,
    chartData.sox_prices, chartData.gush_prices, chartData.btc_prices,
    chartData.custom_prices
  ];
  var values = [];
  series.forEach(function(items) {
    (items || []).forEach(function(value) {
      if (Number.isFinite(value) && value > 0) values.push(value);
    });
  });
  return values;
}

function yAxisRange() {
  var values = allVisiblePrices();
  if (values.length === 0) return null;
  var priceMin = Math.min.apply(null, values);
  var priceMax = Math.max.apply(null, values);
  if (scaleMode === 'log') {
    var logPad = 0.12;
    return [Math.log10(priceMin) - logPad, Math.log10(priceMax) + logPad];
  }
  var span = Math.max(priceMax - priceMin, priceMax * 0.02, 0.01);
  var pad = span * 0.06;
  return [Math.max(0, priceMin - pad), priceMax + pad];
}

function setScale(mode) {
  if (mode !== 'log' && mode !== 'linear') return;
  scaleMode = mode;
  var logBtn = document.getElementById('logScaleBtn');
  var linearBtn = document.getElementById('linearScaleBtn');
  logBtn.classList.toggle('active', mode === 'log');
  linearBtn.classList.toggle('active', mode === 'linear');
  logBtn.setAttribute('aria-pressed', mode === 'log' ? 'true' : 'false');
  linearBtn.setAttribute('aria-pressed', mode === 'linear' ? 'true' : 'false');
  renderChart();
  announce((mode === 'log' ? 'Logarithmic' : 'Linear') + ' price scale selected.');
}

function setChartHeight(value) {
  currentChartHeight = Math.max(520, Math.min(1400, Number(value) || 900));
  document.getElementById('heightValue').textContent = currentChartHeight + ' px';
  Plotly.relayout(chartDiv, {height: currentChartHeight}).then(function() {
    setFrameHeight(document.body.scrollHeight + 20);
  });
}

function setChartWidth(value) {
  currentChartWidth = Math.max(100, Math.min(300, Number(value) || 100));
  var scroll = document.getElementById('chart-scroll');
  var container = document.getElementById('chart-container');
  var width = Math.round(scroll.clientWidth * currentChartWidth / 100);
  document.getElementById('widthValue').textContent = currentChartWidth + '%';
  container.style.width = currentChartWidth + '%';
  Plotly.relayout(chartDiv, {width: width}).then(function() {
    setFrameHeight(document.body.scrollHeight + 20);
  });
  announce('Chart width set to ' + currentChartWidth + ' percent. Scroll horizontally to inspect the full chart.');
}

window.addEventListener('resize', function() {
  if (!chartData) return;
  setChartWidth(currentChartWidth);
});

function resetView() {
  if (!chartData) return;
  Plotly.relayout(chartDiv, {
    'xaxis.range': [chartData.dates[0], chartData.future_end],
    'yaxis.type': scaleMode,
    'yaxis.range': yAxisRange()
  });
}

function clearAll() {
  if (lines.length === 0) return;
  saveUndoState();
  lines = [];
  knownShapeCount = 0;
  clearSelection();
  renderChart();
  renderLineList();
  setComponentValue({action: "set_all", lines: lines});
  announce('All drawn lines cleared.');
}

function deleteLine(idx) {
  if (idx < 0 || idx >= lines.length) return;
  saveUndoState();
  lines.splice(idx, 1);
  renderChart();
  renderLineList();
  setComponentValue({action: "set_all", lines: lines});
  announce('Line ' + (idx + 1) + ' deleted.');
}

function cloneLines(source) {
  return source.map(function(line) { return Object.assign({}, line); });
}

function saveUndoState() {
  undoStack.push(cloneLines(lines));
  if (undoStack.length > 50) undoStack.shift();
  updateLineActionButtons();
}

function undoLastAction() {
  if (undoStack.length === 0) return;
  lines = undoStack.pop();
  knownShapeCount = 0;
  renderChart();
  renderLineList();
  setComponentValue({action: "set_all", lines: lines});
  announce('Last line action undone.');
}

document.addEventListener('keydown', function(event) {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z') {
    if (undoStack.length === 0) return;
    event.preventDefault();
    undoLastAction();
  }
});

function updateLineActionButtons() {
  var hasLines = lines.length > 0;
  document.getElementById('undoBtn').disabled = undoStack.length === 0;
  document.getElementById('eraseBtn').disabled = !hasLines;
  document.getElementById('clearBtn').style.display = hasLines ? '' : 'none';
  if (!hasLines && currentMode === 'erase') setMode('pan');
}

function clearSelection() {
  selectedRange = null;
  document.getElementById('analyze-bar').style.display = 'none';
  renderChart();
  setTimeout(function() { setFrameHeight(document.body.scrollHeight + 20); }, 50);
}

function applyKeyboardSelection() {
  var startDate = document.getElementById('start-date').value;
  var endDate = document.getElementById('end-date').value;
  if (!startDate || !endDate) {
    announce('Enter both a start date and an end date to select a period.');
    return;
  }
  if (startDate > endDate) {
    announce('The start date must be on or before the end date.');
    return;
  }
  var startMs = new Date(startDate + 'T00:00:00').getTime();
  var endMs = new Date(endDate + 'T23:59:59').getTime();
  selectedRange = {start: startDate, end: endDate, startMs: startMs, endMs: endMs};
  document.getElementById('analyze-text').textContent = 'Selected: ' + startDate + ' to ' + endDate;
  document.getElementById('analyze-bar').style.display = 'flex';
  renderChart();
  announce('Period selected from ' + startDate + ' to ' + endDate + '.');
  setTimeout(function() { setFrameHeight(document.body.scrollHeight + 20); }, 100);
}

function analyzeSelection() {
  if (!selectedRange) return;
  setComponentValue({
    action: "analyze",
    lines: lines,
    analyze_start: selectedRange.start,
    analyze_end: selectedRange.end
  });
}

function msToDateStr(ms) {
  var d = new Date(ms);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function trendPoints(startMs, endMs, startY, transformedSlope) {
  var span = endMs - startMs;
  var pointCount = Math.min(
    500,
    Math.max(2, Math.ceil(Math.abs(span) / (14 * 86400000)) + 1)
  );
  var dates = [];
  var prices = [];
  for (var point = 0; point < pointCount; point++) {
    var fraction = point / (pointCount - 1);
    var timestamp = startMs + span * fraction;
    var startTransformed = scaleMode === 'log' ? Math.log10(startY) : startY;
    var transformedPrice = startTransformed + transformedSlope * (timestamp - startMs);
    var price = scaleMode === 'log' ? Math.pow(10, transformedPrice) : transformedPrice;
    if (price > 0 && Number.isFinite(price)) {
      dates.push(new Date(timestamp));
      prices.push(price);
    }
  }
  return {dates: dates, prices: prices};
}

function formatProjectedDate(timestamp) {
  return new Date(timestamp).toLocaleDateString('en-US', {
    month: 'short', day: 'numeric', year: 'numeric'
  });
}

function lineTimestamp(line, point) {
  var milliseconds = line['x' + point + '_ms'];
  if (Number.isFinite(milliseconds)) return milliseconds;
  return new Date(line['x' + point]).getTime();
}

function eventToChartTimestamp(event) {
  var layout = chartDiv._fullLayout;
  if (!layout || !layout.xaxis || !layout._size) return null;
  var plotArea = layout._size;
  var chartRect = chartDiv.getBoundingClientRect();
  var mouseX = event.clientX - chartRect.left;
  if (mouseX < plotArea.l || mouseX > plotArea.l + plotArea.w) return null;
  var xRange = layout.xaxis.range;
  var rangeStart = typeof xRange[0] === 'string' ? new Date(xRange[0]).getTime() : xRange[0];
  var rangeEnd = typeof xRange[1] === 'string' ? new Date(xRange[1]).getTime() : xRange[1];
  return rangeStart + ((mouseX - plotArea.l) / plotArea.w) * (rangeEnd - rangeStart);
}

function extendLineToDate(index, timestamp) {
  if (index < 0 || index >= lines.length || !Number.isFinite(timestamp)) return false;
  var line = lines[index];
  var start = lineTimestamp(line, 1);
  var end = lineTimestamp(line, 2);
  var earliest = Math.min(start, end);
  var latest = Math.max(start, end);
  if (timestamp >= earliest && timestamp <= latest) {
    announce('Click beyond either endpoint to extend Line ' + (index + 1) + '.');
    return false;
  }

  var transformedStart = scaleMode === 'log' ? Math.log10(line.y1) : line.y1;
  var transformedEnd = scaleMode === 'log' ? Math.log10(line.y2) : line.y2;
  var slope = (transformedEnd - transformedStart) / (end - start);
  var transformedPrice = transformedStart + slope * (timestamp - start);
  var price = scaleMode === 'log' ? Math.pow(10, transformedPrice) : transformedPrice;
  if (!Number.isFinite(price) || price <= 0) {
    announce('That extension would produce an invalid price.');
    return false;
  }

  saveUndoState();
  var replacePoint;
  if (timestamp < earliest) {
    replacePoint = start <= end ? 1 : 2;
  } else {
    replacePoint = start >= end ? 1 : 2;
  }
  line['x' + replacePoint + '_ms'] = timestamp;
  line['x' + replacePoint] = msToDateStr(timestamp);
  line['y' + replacePoint] = price;
  extendingLineIndex = -1;
  setMode('pan');
  renderChart();
  renderLineList();
  setComponentValue({action: "set_all", lines: lines});
  announce('Line ' + (index + 1) + ' extended to ' + msToDateStr(timestamp) + '.');
  return true;
}

function inspectTrendLine(event) {
  if (currentMode === 'select' || lines.length === 0) {
    trendTooltip.style.display = 'none';
    return;
  }
  var layout = chartDiv._fullLayout;
  if (!layout || !layout.xaxis || !layout.yaxis || !layout._size) return;
  var plotArea = layout._size;
  var chartRect = chartDiv.getBoundingClientRect();
  var mouseX = event.clientX - chartRect.left;
  var mouseY = event.clientY - chartRect.top;
  if (
    mouseX < plotArea.l || mouseX > plotArea.l + plotArea.w ||
    mouseY < plotArea.t || mouseY > plotArea.t + plotArea.h
  ) {
    trendTooltip.style.display = 'none';
    return;
  }

  var xRange = layout.xaxis.range;
  var x0 = typeof xRange[0] === 'string' ? new Date(xRange[0]).getTime() : xRange[0];
  var x1 = typeof xRange[1] === 'string' ? new Date(xRange[1]).getTime() : xRange[1];
  var xFraction = (mouseX - plotArea.l) / plotArea.w;
  var timestamp = x0 + xFraction * (x1 - x0);
  var yRange = layout.yaxis.range;
  var ySpan = yRange[1] - yRange[0];
  var futureMs = new Date(chartData.future_end).getTime();
  var nearest = null;

  for (var index = 0; index < lines.length; index++) {
    var line = lines[index];
    var lineStart = lineTimestamp(line, 1);
    var lineEnd = lineTimestamp(line, 2);
    var lineSpan = lineEnd - lineStart;
    if (!lineSpan || line.y1 <= 0 || line.y2 <= 0) continue;
    var earliest = Math.min(lineStart, lineEnd) - 63072000000;
    if (timestamp < earliest || timestamp > futureMs) continue;

    var transformedStart = scaleMode === 'log' ? Math.log10(line.y1) : line.y1;
    var transformedEnd = scaleMode === 'log' ? Math.log10(line.y2) : line.y2;
    var slope = (transformedEnd - transformedStart) / lineSpan;
    var transformedPrice = transformedStart + slope * (timestamp - lineStart);
    var price = scaleMode === 'log' ? Math.pow(10, transformedPrice) : transformedPrice;
    if (!Number.isFinite(price) || price <= 0) continue;

    var yFraction = (transformedPrice - yRange[0]) / ySpan;
    var projectedY = plotArea.t + (1 - yFraction) * plotArea.h;
    var distance = Math.abs(mouseY - projectedY);
    if (!nearest || distance < nearest.distance) {
      nearest = {index: index, price: price, distance: distance};
    }
  }

  if (!nearest) {
    hoveredLineIndex = -1;
    hoveredLineDistance = Infinity;
    trendTooltip.style.display = 'none';
    return;
  }

  hoveredLineIndex = nearest.index;
  hoveredLineDistance = nearest.distance;
  trendTooltip.innerHTML =
    '<strong>Trend line ' + (nearest.index + 1) + ' projection</strong>' +
    '<div>Projected date: ' + formatProjectedDate(timestamp) + '</div>' +
    '<div>Projected SOXL price: $' + nearest.price.toLocaleString('en-US', {
      minimumFractionDigits: 2, maximumFractionDigits: 2
    }) + '</div>' +
    (currentMode === 'erase' ? '<div><b>Click to erase this line</b></div>' : '');
  trendTooltip.style.display = 'block';
  var tooltipWidth = trendTooltip.offsetWidth || 270;
  var visibleLeft = chartScroll.scrollLeft;
  var visibleRight = visibleLeft + chartScroll.clientWidth;
  var left = mouseX + 16;
  if (left + tooltipWidth > visibleRight - 8) {
    left = mouseX - tooltipWidth - 16;
  }
  left = Math.max(visibleLeft + 8, Math.min(left, visibleRight - tooltipWidth - 8));
  var top = mouseY > 100 ? mouseY - 88 : mouseY + 18;
  trendTooltip.style.left = left + 'px';
  trendTooltip.style.top = Math.max(8, top) + 'px';
}

chartContainer.addEventListener('pointermove', inspectTrendLine, true);
chartContainer.addEventListener('mousemove', inspectTrendLine, true);
chartContainer.addEventListener('mouseleave', function() {
  hoveredLineIndex = -1;
  hoveredLineDistance = Infinity;
  trendTooltip.style.display = 'none';
});

chartContainer.addEventListener('click', function(event) {
  if (currentMode === 'extend' && extendingLineIndex >= 0) {
    var timestamp = eventToChartTimestamp(event);
    if (timestamp === null) return;
    event.preventDefault();
    event.stopPropagation();
    extendLineToDate(extendingLineIndex, timestamp);
    return;
  }
  if (currentMode === 'erase' && hoveredLineIndex >= 0 && hoveredLineDistance <= 35) {
    event.preventDefault();
    event.stopPropagation();
    deleteLine(hoveredLineIndex);
  }
}, true);

function pxToDate(px) {
  var layout = chartDiv._fullLayout;
  if (!layout || !layout.xaxis) return null;
  var plotArea = layout._size;
  var containerRect = document.getElementById('chart-container').getBoundingClientRect();
  var chartRect = chartDiv.getBoundingClientRect();
  var relX = px - (chartRect.left - containerRect.left) - plotArea.l;
  var xRange = layout.xaxis.range;
  var frac = relX / plotArea.w;
  if (frac < 0) frac = 0;
  if (frac > 1) frac = 1;
  var xMs;
  if (typeof xRange[0] === 'string') {
    var x0 = new Date(xRange[0]).getTime();
    var x1 = new Date(xRange[1]).getTime();
    xMs = x0 + frac * (x1 - x0);
  } else {
    xMs = xRange[0] + frac * (xRange[1] - xRange[0]);
  }
  return xMs;
}

function dateToPx(dateMs) {
  var layout = chartDiv._fullLayout;
  if (!layout || !layout.xaxis) return 0;
  var plotArea = layout._size;
  var xRange = layout.xaxis.range;
  var x0, x1;
  if (typeof xRange[0] === 'string') {
    x0 = new Date(xRange[0]).getTime();
    x1 = new Date(xRange[1]).getTime();
  } else {
    x0 = xRange[0]; x1 = xRange[1];
  }
  var frac = (dateMs - x0) / (x1 - x0);
  var chartRect = chartDiv.getBoundingClientRect();
  var containerRect = document.getElementById('chart-container').getBoundingClientRect();
  return (chartRect.left - containerRect.left) + plotArea.l + frac * plotArea.w;
}

selectOverlay.addEventListener('mousedown', function(e) {
  if (currentMode !== 'select') return;
  selecting = true;
  selectStartX = e.offsetX;
  e.preventDefault();
});

selectOverlay.addEventListener('mousemove', function(e) {
  if (!selecting) return;
  var currentX = e.offsetX;
  var startMs = pxToDate(Math.min(selectStartX, currentX));
  var endMs = pxToDate(Math.max(selectStartX, currentX));
  if (startMs && endMs) {
    selectedRange = { start: msToDateStr(startMs), end: msToDateStr(endMs), startMs: startMs, endMs: endMs };
    renderChart();
  }
});

selectOverlay.addEventListener('mouseup', function(e) {
  if (!selecting) return;
  selecting = false;
  var endX = e.offsetX;
  var leftPx = Math.min(selectStartX, endX);
  var rightPx = Math.max(selectStartX, endX);

  if (rightPx - leftPx < 10) {
    selectedRange = null;
    renderChart();
    return;
  }

  var startMs = pxToDate(leftPx);
  var endMs = pxToDate(rightPx);
  if (!startMs || !endMs) return;

  var startDate = msToDateStr(startMs);
  var endDate = msToDateStr(endMs);
  selectedRange = { start: startDate, end: endDate, startMs: startMs, endMs: endMs };

  document.getElementById('analyze-text').textContent = 'Selected: ' + startDate + ' to ' + endDate;
  document.getElementById('analyze-bar').style.display = 'flex';
  announce('Period selected from ' + startDate + ' to ' + endDate + '.');

  renderChart();
  setTimeout(function() { setFrameHeight(document.body.scrollHeight + 20); }, 100);
});

selectOverlay.addEventListener('mouseleave', function() {
  if (selecting) {
    selecting = false;
  }
});

chartDiv.addEventListener('plotly_doubleclick', function(e) {
  if (e && e.preventDefault) e.preventDefault();
  return false;
});

chartDiv.addEventListener('dblclick', function(e) {
  if (lines.length === 0) return;
  if (currentMode === 'select') return;

  var layout = chartDiv._fullLayout;
  if (!layout || !layout.xaxis || !layout.yaxis) return;

  var plotArea = layout._size;
  var chartRect = chartDiv.getBoundingClientRect();
  var relX = e.clientX - chartRect.left - plotArea.l;
  var relY = e.clientY - chartRect.top - plotArea.t;

  if (relX < 0 || relX > plotArea.w || relY < 0 || relY > plotArea.h) return;

  var xRange = layout.xaxis.range;
  var yRange = layout.yaxis.range;
  var xFrac = relX / plotArea.w;
  var yFrac = 1 - (relY / plotArea.h);

  var x0, x1;
  if (typeof xRange[0] === 'string') {
    x0 = new Date(xRange[0]).getTime();
    x1 = new Date(xRange[1]).getTime();
  } else {
    x0 = xRange[0]; x1 = xRange[1];
  }
  var clickXms = x0 + xFrac * (x1 - x0);
  var clickAxisY = yRange[0] + yFrac * (yRange[1] - yRange[0]);

  var xSpan = x1 - x0;
  var ySpan = yRange[1] - yRange[0];

  var bestIdx = -1;
  var bestDist = Infinity;
  var threshold = 0.05;

  for (var i = 0; i < lines.length; i++) {
    var ln = lines[i];
    if (!ln.y1 || !ln.y2 || ln.y1 <= 0 || ln.y2 <= 0) continue;
    var lx1 = lineTimestamp(ln, 1), ly1 = scaleMode === 'log' ? Math.log10(ln.y1) : ln.y1;
    var lx2 = lineTimestamp(ln, 2), ly2 = scaleMode === 'log' ? Math.log10(ln.y2) : ln.y2;
    var dt = lx2 - lx1;
    if (dt === 0) continue;
    var slope = (ly2 - ly1) / dt;
    var projectedY = ly1 + slope * (clickXms - lx1);
    var normDy = Math.abs(projectedY - clickAxisY) / ySpan;
    if (normDy < threshold && normDy < bestDist) {
      bestDist = normDy;
      bestIdx = i;
    }
  }

  if (bestIdx >= 0) {
    e.stopPropagation();
    e.preventDefault();
    deleteLine(bestIdx);
  }
}, true);

function handlePlotlyRelayout(eventData) {
  if (currentMode !== 'draw' || !eventData) return;

  var hasShapeKey = false;
  for (var key in eventData) {
    if (key.indexOf('shapes') === 0) {
      hasShapeKey = true;
      break;
    }
  }
  if (!hasShapeKey) return;

  var shapes = (chartDiv.layout && chartDiv.layout.shapes) ? chartDiv.layout.shapes : [];
  if (shapes.length <= knownShapeCount) return;

  var lastShape = shapes[shapes.length - 1];
  if (!lastShape || lastShape.type !== 'line') return;

  var x0_ms = new Date(lastShape.x0).getTime();
  var x1_ms = new Date(lastShape.x1).getTime();
  var y0 = lastShape.y0;
  var y1 = lastShape.y1;

  if (Math.abs(x1_ms - x0_ms) < 86400000) return;
  if (!Number.isFinite(y0) || !Number.isFinite(y1) || y0 <= 0 || y1 <= 0) return;

  saveUndoState();
  lines.push({
    x1_ms: x0_ms, y1: y0,
    x2_ms: x1_ms, y2: y1,
    x1: msToDateStr(x0_ms),
    x2: msToDateStr(x1_ms)
  });

  renderChart();
  renderLineList();
  setComponentValue({action: "set_all", lines: lines});
}

function renderChart() {
  if (!chartData) return;
  var traces = [];

  var hasQQQ = chartData.qqq_dates && chartData.qqq_dates.length > 0;
  var hasTQQQ = chartData.tqqq_dates && chartData.tqqq_dates.length > 0;
  var hasTLT = chartData.tlt_dates && chartData.tlt_dates.length > 0;
  var hasXLU = chartData.xlu_dates && chartData.xlu_dates.length > 0;
  var hasVIX = chartData.vix_dates && chartData.vix_dates.length > 0;
  var hasSOX = chartData.sox_dates && chartData.sox_dates.length > 0;
  var hasGUSH = chartData.gush_dates && chartData.gush_dates.length > 0;
  var hasBTC = chartData.btc_dates && chartData.btc_dates.length > 0;
  var hasCustom = chartData.custom_dates && chartData.custom_dates.length > 0;
  var hasOverlay = hasQQQ || hasTQQQ || hasTLT || hasXLU || hasVIX || hasSOX || hasGUSH || hasBTC || hasCustom;

  traces.push({
    x: chartData.dates, y: chartData.prices,
    mode: 'lines', name: 'SOXL',
    line: {color: '#1E88E5', width: 1.5},
    yaxis: 'y',
    hovertemplate: 'SOXL: %{x|%Y-%m-%d}<br>$%{y:.2f}<extra></extra>'
  });

  if (hasQQQ) {
    traces.push({
      x: chartData.qqq_dates, y: chartData.qqq_prices,
      customdata: chartData.qqq_actual,
      mode: 'lines', name: 'QQQ',
      line: {color: '#FF6F00', width: 1.5},
      yaxis: 'y',
      hovertemplate: 'QQQ: %{x|%Y-%m-%d}<br>$%{customdata:.2f}<extra></extra>'
    });
  }

  if (hasTQQQ) {
    traces.push({
      x: chartData.tqqq_dates, y: chartData.tqqq_prices,
      customdata: chartData.tqqq_actual,
      mode: 'lines', name: 'TQQQ',
      line: {color: '#AB47BC', width: 1.5},
      yaxis: 'y',
      hovertemplate: 'TQQQ: %{x|%Y-%m-%d}<br>$%{customdata:.2f}<extra></extra>'
    });
  }

  if (hasTLT) {
    traces.push({
      x: chartData.tlt_dates, y: chartData.tlt_prices,
      customdata: chartData.tlt_actual,
      mode: 'lines', name: 'TLT',
      line: {color: '#26A69A', width: 1.5},
      yaxis: 'y',
      hovertemplate: 'TLT: %{x|%Y-%m-%d}<br>$%{customdata:.2f}<extra></extra>'
    });
  }

  if (hasXLU) {
    traces.push({
      x: chartData.xlu_dates, y: chartData.xlu_prices,
      customdata: chartData.xlu_actual,
      mode: 'lines', name: 'XLU',
      line: {color: '#EF5350', width: 1.5},
      yaxis: 'y',
      hovertemplate: 'XLU: %{x|%Y-%m-%d}<br>$%{customdata:.2f}<extra></extra>'
    });
  }

  if (hasVIX) {
    traces.push({
      x: chartData.vix_dates, y: chartData.vix_prices,
      customdata: chartData.vix_actual,
      mode: 'lines', name: 'VIX',
      line: {color: '#FFB300', width: 1.5, dash: 'dot'},
      yaxis: 'y',
      hovertemplate: 'VIX: %{x|%Y-%m-%d}<br>%{customdata:.2f}<extra></extra>'
    });
  }

  if (hasSOX) {
    traces.push({
      x: chartData.sox_dates, y: chartData.sox_prices,
      customdata: chartData.sox_actual,
      mode: 'lines', name: 'SOX',
      line: {color: '#43A047', width: 1.5},
      yaxis: 'y',
      hovertemplate: 'SOX: %{x|%Y-%m-%d}<br>%{customdata:.2f}<extra></extra>'
    });
  }

  if (hasGUSH) {
    traces.push({
      x: chartData.gush_dates, y: chartData.gush_prices,
      customdata: chartData.gush_actual,
      mode: 'lines', name: 'GUSH',
      line: {color: '#E91E63', width: 1.5},
      yaxis: 'y',
      hovertemplate: 'GUSH: %{x|%Y-%m-%d}<br>$%{customdata:.2f}<extra></extra>'
    });
  }

  if (hasBTC) {
    traces.push({
      x: chartData.btc_dates, y: chartData.btc_prices,
      customdata: chartData.btc_actual,
      mode: 'lines', name: 'BTC',
      line: {color: '#F7931A', width: 1.8},
      yaxis: 'y',
      hovertemplate: 'BTC: %{x|%Y-%m-%d}<br>$%{customdata:,.2f}<extra></extra>'
    });
  }

  if (hasCustom) {
    traces.push({
      x: chartData.custom_dates, y: chartData.custom_prices,
      customdata: chartData.custom_actual,
      mode: 'lines', name: chartData.custom_label,
      line: {color: '#37474F', width: 2.2, dash: 'dash'},
      yaxis: 'y',
      hovertemplate: chartData.custom_label + ': %{x|%Y-%m-%d}<br>$%{customdata:,.2f}<extra></extra>'
    });
  }

  var futureMs = new Date(chartData.future_end).getTime();

  for (var i = 0; i < lines.length; i++) {
    var ln = lines[i];
    var x1 = ln.x1_ms, y1 = ln.y1, x2 = ln.x2_ms, y2 = ln.y2;
    if (!y1 || !y2 || y1 <= 0 || y2 <= 0) continue;
    var dt = x2 - x1;
    if (dt === 0) continue;
    var transformedY1 = scaleMode === 'log' ? Math.log10(y1) : y1;
    var transformedY2 = scaleMode === 'log' ? Math.log10(y2) : y2;
    var transformedSlope = (transformedY2 - transformedY1) / dt;
    var color = COLORS[i % COLORS.length];
    var segmentStart = Math.min(x1, x2);
    var segmentEnd = Math.max(x1, x2);
    var segmentStartY = segmentStart === x1 ? y1 : y2;
    var segment = trendPoints(segmentStart, segmentEnd, segmentStartY, transformedSlope);

    traces.push({
      x: segment.dates, y: segment.prices,
      mode: 'lines+markers', showlegend: false,
      line: {color: color, width: 2.5},
      marker: {size: 14, color: 'rgba(0,0,0,0)'},
      hovertemplate: '<b>Trend line ' + (i+1) + '</b><br>Projected date: %{x|%b %d, %Y}<br>Projected SOXL price: $%{y:,.2f}<extra></extra>'
    });

    var fwdEnd = Math.max(x1, x2);
    var fwdY0 = fwdEnd === x2 ? y2 : y1;
    var fwdStart = scaleMode === 'log' ? Math.log10(fwdY0) : fwdY0;
    var fwdTransformedY = fwdStart + transformedSlope * (futureMs - fwdEnd);
    var fwdY = scaleMode === 'log' ? Math.pow(10, fwdTransformedY) : fwdTransformedY;
    if (fwdY > 0 && Number.isFinite(fwdY) && (scaleMode !== 'log' || (fwdTransformedY > -3 && fwdTransformedY < 6))) {
      var forward = trendPoints(fwdEnd, futureMs, fwdY0, transformedSlope);
      traces.push({
        x: forward.dates,
        y: forward.prices,
        mode: 'lines+markers', showlegend: false,
        line: {color: color, width: 2, dash: 'dash'},
        marker: {size: 14, color: 'rgba(0,0,0,0)'},
        hovertemplate: '<b>Trend line ' + (i+1) + ' projection</b><br>Projected date: %{x|%b %d, %Y}<br>Projected SOXL price: $%{y:,.2f}<extra></extra>'
      });
    }

    var backEnd = Math.min(x1, x2);
    var backY0 = backEnd === x1 ? y1 : y2;
    var backMs = backEnd - 63072000000;
    var backStart = scaleMode === 'log' ? Math.log10(backY0) : backY0;
    var backTransformedY = backStart + transformedSlope * (backMs - backEnd);
    var backY = scaleMode === 'log' ? Math.pow(10, backTransformedY) : backTransformedY;
    if (backY > 0 && Number.isFinite(backY) && (scaleMode !== 'log' || (backTransformedY > -3 && backTransformedY < 6))) {
      var backward = trendPoints(backMs, backEnd, backY, transformedSlope);
      traces.push({
        x: backward.dates,
        y: backward.prices,
        mode: 'lines+markers', showlegend: false,
        line: {color: color, width: 2, dash: 'dash'},
        marker: {size: 14, color: 'rgba(0,0,0,0)'},
        hovertemplate: '<b>Trend line ' + (i+1) + ' projection</b><br>Projected date: %{x|%b %d, %Y}<br>Projected SOXL price: $%{y:,.2f}<extra></extra>'
      });
    }
  }

  var shapes = [];
  if (selectedRange) {
    shapes.push({
      type: 'rect',
      xref: 'x', yref: 'paper',
      x0: selectedRange.start, x1: selectedRange.end,
      y0: 0, y1: 1,
      fillcolor: 'rgba(21, 101, 192, 0.15)',
      line: { color: '#1565C0', width: 2 }
    });
  }

  var layout = {
    yaxis: {
      type: scaleMode, tickprefix: '$', title: '',
      gridcolor: '#eee',
      range: yAxisRange(),
      fixedrange: false
    },
    xaxis: {
      type: 'date',
      range: [chartData.dates[0], chartData.future_end],
      title: '', gridcolor: '#eee',
      tickformatstops: [
        {dtickrange: [null, 86400000], value: '%b %d, %Y'},
        {dtickrange: [86400000, 'M1'], value: '%b %d, %Y'},
        {dtickrange: ['M1', 'M12'], value: '%b %Y'},
        {dtickrange: ['M12', null], value: '%Y'}
      ],
      fixedrange: false
    },
    template: 'plotly_white',
    width: Math.round(document.getElementById('chart-scroll').clientWidth * currentChartWidth / 100),
    height: currentChartHeight,
    margin: {l: 65, r: 20, t: 10, b: 40},
    showlegend: hasOverlay,
    legend: { x: 0.01, y: 0.99, bgcolor: 'rgba(255,255,255,0.8)', bordercolor: '#ddd', borderwidth: 1 },
    hovermode: 'closest',
    hoverdistance: 20,
    dragmode: currentMode === 'draw' ? 'drawline' : 'pan',
    newshape: {
      line: { color: '#888', width: 2 }
    },
    shapes: shapes,
    plot_bgcolor: 'white',
    paper_bgcolor: 'white',
    font: {color: '#333'}
  };


  var config = {
    scrollZoom: currentMode !== 'select',
    displayModeBar: currentMode !== 'select',
    modeBarButtonsToRemove: ['select2d', 'lasso2d', 'drawclosedpath', 'drawopenpath', 'drawcircle', 'drawrect', 'eraseshape']
  };

  Plotly.react(chartDiv, traces, layout, config).then(function() {
    if (!plotlyEventsBound && typeof chartDiv.on === 'function') {
      chartDiv.on('plotly_relayout', handlePlotlyRelayout);
      plotlyEventsBound = true;
    }
  });
  knownShapeCount = 0;
  document.getElementById('clearBtn').style.display = lines.length > 0 ? '' : 'none';
}

function renderLineList() {
  var el = document.getElementById('line-list');
  updateLineActionButtons();
  if (lines.length === 0) { el.innerHTML = ''; return; }
  var html = '';
  for (var i = 0; i < lines.length; i++) {
    var ln = lines[i];
    var color = COLORS[i % COLORS.length];
    html += '<div class="line-row">'
      + '<span class="line-dot" style="background:' + color + '"></span>'
      + '<span>Line ' + (i+1) + ': ' + ln.x1 + ' ($' + ln.y1.toFixed(2) + ') \u2192 ' + ln.x2 + ' ($' + ln.y2.toFixed(2) + ')</span>'
      + '<button class="lext' + (currentMode === 'extend' && extendingLineIndex === i ? ' active' : '') + '" aria-label="Extend line ' + (i+1) + '" onclick="startExtendLine(' + i + ')">Extend</button>'
      + '<button class="ldel" aria-label="Delete line ' + (i+1) + '" onclick="deleteLine(' + i + ')">Delete</button>'
      + '</div>';
  }
  el.innerHTML = html;
  setTimeout(function() { setFrameHeight(document.body.scrollHeight + 20); }, 50);
}
