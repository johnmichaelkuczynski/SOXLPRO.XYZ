<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hypothetical entry price</title>
  <style>
    :root { color-scheme: light; --ink: #243c58; --muted: #60758b; --blue: #3276be; --line: #d7e4f1; --surface: #f2f7fc; }
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; color: var(--ink); font-family: system-ui, sans-serif; }
    .component { height: 200px; padding: 4px 8px 0; }
    .slider-area { position: relative; height: 144px; }
    .bubble { position: absolute; bottom: 43px; left: 0; width: max-content; max-width: 100%; padding: 9px 13px; border: 1px solid #cbdff2; border-radius: 10px; background: var(--surface); text-align: center; pointer-events: none; }
    .bubble::after { content: ""; position: absolute; left: var(--arrow-x, 50%); bottom: -6px; width: 10px; height: 10px; border-right: 1px solid #cbdff2; border-bottom: 1px solid #cbdff2; background: var(--surface); transform: translateX(-50%) rotate(45deg); }
    .price { display: block; font-size: 19px; font-weight: 700; letter-spacing: -.4px; font-variant-numeric: tabular-nums; line-height: 1.25; }
    .odds { display: block; margin-top: 2px; color: #245d96; font-size: 13px; font-weight: 650; line-height: 1.3; }
    .detail { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; line-height: 1.35; }
    input[type="range"] { position: absolute; bottom: 13px; left: 0; width: 100%; height: 24px; margin: 0; padding: 0; appearance: none; -webkit-appearance: none; background: transparent; cursor: pointer; touch-action: pan-y; --progress: 0%; }
    input[type="range"]::-webkit-slider-runnable-track { height: 5px; border-radius: 5px; background: linear-gradient(to right, var(--blue) 0%, var(--blue) var(--progress), var(--line) var(--progress), var(--line) 100%); }
    input[type="range"]::-moz-range-track { height: 5px; border-radius: 5px; background: var(--line); }
    input[type="range"]::-moz-range-progress { height: 5px; border-radius: 5px; background: var(--blue); }
    input[type="range"]::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; margin-top: -7.5px; border: 3px solid var(--blue); border-radius: 50%; background: #f7fbff; box-shadow: 0 1px 3px #243c5820; }
    input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border: 3px solid var(--blue); border-radius: 50%; background: #f7fbff; box-shadow: 0 1px 3px #243c5820; }
    input:focus-visible { outline: 2px solid #3276be; outline-offset: 5px; border-radius: 5px; }
    .endpoints { display: flex; justify-content: space-between; margin-top: -9px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .qualification { margin: 10px 0 0; color: var(--muted); font-size: 10px; line-height: 1.4; }
    @media (max-width: 340px) { .bubble { padding: 8px 9px; } .odds { font-size: 12px; } .detail { font-size: 9px; } .qualification { font-size: 9px; } }
  </style>
</head>
<body>
  <main class="component">
    <div class="slider-area" id="area">
      <output class="bubble" id="bubble" for="price" aria-live="polite" aria-atomic="true">
        <span class="price" id="price-label">$1.00</span>
        <span class="odds" id="odds">Model unavailable</span>
        <span class="detail" id="detail">Model estimate · Chosen horizon</span>
      </output>
      <input id="price" type="range" min="1" max="500" step="0.01" value="1" aria-label="Hypothetical entry price (USD)" aria-describedby="qualification">
    </div>
    <div class="endpoints" aria-hidden="true"><span>$1</span><span>$500</span></div>
    <p class="qualification" id="qualification">Growth means finishing above the selected starting price at the chosen horizon. Model assumptions, not validated predictive probabilities.</p>
  </main>
  <script>
    (() => {
      "use strict";
      const slider = document.getElementById("price");
      const bubble = document.getElementById("bubble");
      const area = document.getElementById("area");
      const priceLabel = document.getElementById("price-label");
      const oddsLabel = document.getElementById("odds");
      const detail = document.getElementById("detail");
      let args = {};
      let lastReceivedValue;
      const finite = value => typeof value === "number" && Number.isFinite(value);
      const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
      const post = (type, extra = {}) => window.parent.postMessage({ isStreamlitMessage: true, type, ...extra }, "*");

      function estimate(price) {
        const curve = args.probability_curve;
        if (!Array.isArray(curve) || !curve.length) return { supported: false };
        let low = 0;
        let high = curve.length - 1;
        while (low < high) {
          const middle = Math.floor((low + high) / 2);
          if (curve[middle].price < price) low = middle + 1;
          else high = middle;
        }
        const right = curve[low];
        const left = low > 0 && right.price > price ? curve[low - 1] : right;
        if (!left || !right || !finite(left.price) || !finite(right.price) ||
            !finite(left.probability) || !finite(right.probability)) return { supported: false };
        const fraction = right.price > left.price
          ? clamp((price - left.price) / (right.price - left.price), 0, 1) : 0;
        return {
          supported: true,
          probability: clamp(left.probability + fraction * (right.probability - left.probability), 0, 1) * 100,
          extrapolated: Boolean(left.extrapolated || right.extrapolated)
        };
      }

      function positionBubble() {
        const width = area.clientWidth;
        const fraction = (Number(slider.value) - 1) / 499;
        const thumb = 10 + fraction * Math.max(0, width - 20);
        const bubbleWidth = bubble.getBoundingClientRect().width;
        const left = clamp(thumb - bubbleWidth / 2, 0, Math.max(0, width - bubbleWidth));
        bubble.style.left = left + "px";
        bubble.style.setProperty("--arrow-x", (thumb - left) + "px");
        slider.style.setProperty("--progress", (fraction * 100) + "%");
      }

      function update() {
        const price = Number(slider.value);
        const result = estimate(price);
        const formatted = "$" + price.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const odds = result.supported ? result.probability.toFixed(4) + "% probability of growth" : "Model unavailable";
        const horizon = typeof args.horizon_label === "string" && args.horizon_label.trim()
          ? args.horizon_label.trim()
          : (Number.isInteger(args.horizon) && args.horizon > 0 ? args.horizon + " trading sessions" : "Chosen horizon");
        priceLabel.textContent = formatted;
        oddsLabel.textContent = odds;
        const label = result.extrapolated ? "Extrapolated model estimate" : "Model estimate";
        const count = Number.isInteger(args.model_count) && args.model_count > 0
          ? " · n=" + args.model_count : "";
        detail.textContent = label + " · " + horizon + (result.supported ? count : "");
        bubble.title = !result.supported && typeof args.model_error === "string"
          ? args.model_error : "";
        slider.setAttribute("aria-valuetext", formatted + "; " + odds + "; " + detail.textContent);
        positionBubble();
      }

      slider.addEventListener("input", update);
      slider.addEventListener("change", () => {
        update();
        post("streamlit:setComponentValue", { value: Number(slider.value), dataType: "json" });
      });
      window.addEventListener("message", event => {
        if (event.source !== window.parent || !event.data || event.data.type !== "streamlit:render") return;
        args = event.data.args || {};
        if (finite(args.value) && args.value !== lastReceivedValue) {
          slider.value = String(clamp(args.value, 1, 500));
          lastReceivedValue = args.value;
        }
        slider.disabled = Boolean(event.data.disabled);
        update();
        post("streamlit:setFrameHeight", { height: 200 });
      });
      window.addEventListener("resize", positionBubble);
      if (typeof ResizeObserver !== "undefined") new ResizeObserver(positionBubble).observe(area);
      update();
      post("streamlit:componentReady", { apiVersion: 1 });
      post("streamlit:setFrameHeight", { height: 200 });
    })();
  </script>
</body>
</html>
